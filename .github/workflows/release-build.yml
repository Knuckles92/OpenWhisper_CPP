# Build a OpenWhisper_CPP release candidate: resolve one commit, run the full CI on it, build the
# Windows setup from that commit, smoke-test install, upgrade and uninstall on the runner, and
# keep the candidate (setup, native update ZIP, build metadata, checksums and signing report) as
# workflow artifacts of this run. Nothing is uploaded to a release, pushed or tagged.
name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, branch or tag to build (default the selected branch)
        required: false
        type: string
      version:
        description: Product version X.Y.Z (default the one in CMakeLists.txt)
        required: false
        type: string

permissions:
  contents: read

# One candidate build per source at a time.
concurrency:
  group: release-build-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: 4702e381dbbd9b54d3f7e1eb565cd8981c1814cd
  QT_VERSION: "6.10.3"
  AQTINSTALL_VERSION: "3.1.21"
  INNO_SETUP_VERSION: "6.4.0"

jobs:
  source:
    name: Resolve candidate source once
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qualification:
    name: Full source qualification
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}

  windows:
    name: Windows setup
    needs: [source, qualification]
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\..\vcpkg-archives,readwrite
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve the version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) {
            $line = Select-String -LiteralPath CMakeLists.txt -Pattern 'set\(OPENWHISPER_CPP_VERSION "(\d+\.\d+\.\d+)" CACHE' | Select-Object -First 1
            if (-not $line) { throw 'No default version in CMakeLists.txt' }
            $version = $line.Matches[0].Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z, not '$version'" }
          if ($version -eq '0.0.0') { throw '0.0.0 is the upgrade smoke test previous version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore the Qt kit
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-aqt-${{ env.AQTINSTALL_VERSION }}
      - name: Install the Qt kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==$env:AQTINSTALL_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Point the build at the Qt kit
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "Qt\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path "$kit\bin\windeployqt.exe")) { throw "No Qt kit with windeployqt at $kit" }
          "Qt6_ROOT=$kit" >> $env:GITHUB_ENV
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\vcpkg-archives
          key: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-
      - name: Install vcpkg at the manifest's baseline and Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\..\vcpkg-archives" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install innosetup --version=$env:INNO_SETUP_VERSION --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OPENWHISPER_CPP_ISCC=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" >> $env:GITHUB_ENV
      - name: Configure Windows code signing
        # Optional, one method at a time. With either set the executables, the
        # uninstaller and the setup exe are Authenticode signed, timestamped
        # and verified; with neither they stay unsigned and the run says so.
        # tools/release/README.md lists the variables. The secrets are scoped
        # to the steps that use them, not to the whole job, so dependency
        # installs and tests never see them.
        shell: pwsh
        env:
          # Method 1: an OV/EV code-signing certificate exported as a PFX.
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Method 2: Azure Trusted Signing (an app registration with the
          # "Trusted Signing Certificate Profile Signer" role).
          AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          TRUSTED_SIGNING_CLIENT_VERSION: "1.0.53"
        run: |
          # An unset secret arrives as an empty or missing variable.
          $pfx = -not [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PFX)
          $azure = -not [string]::IsNullOrEmpty($env:AZURE_TRUSTED_SIGNING_CLIENT_ID)
          if ($pfx -and $azure) {
            throw 'Set either the WINDOWS_CERTIFICATE_* or the AZURE_TRUSTED_SIGNING_* secrets, not both.'
          }
          if ($pfx) {
            $file = Join-Path $env:RUNNER_TEMP 'openwhisper-cpp-signing.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            try {
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
            } finally {
              Remove-Item -LiteralPath $file -Force
            }
            $thumbprint = @($cert | Where-Object HasPrivateKey)[0].Thumbprint
            if (-not $thumbprint) { throw 'The PFX has no certificate with a private key.' }
            "OPENWHISPER_CPP_SIGN_CERT_SHA1=$thumbprint" >> $env:GITHUB_ENV
            Write-Host "::notice title=Windows signing::Signing with certificate $thumbprint."
          } elseif ($azure) {
            foreach ($name in 'TENANT_ID', 'CLIENT_SECRET', 'ENDPOINT', 'ACCOUNT', 'PROFILE') {
              if (-not [Environment]::GetEnvironmentVariable("AZURE_TRUSTED_SIGNING_$name")) {
                throw "AZURE_TRUSTED_SIGNING_$name is missing."
              }
            }
            $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'
            nuget install Microsoft.Trusted.Signing.Client -Version $env:TRUSTED_SIGNING_CLIENT_VERSION -OutputDirectory $dir -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the Trusted Signing client.' }
            $dlib = Get-ChildItem -Path $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found.' }
            $metadata = Join-Path $env:RUNNER_TEMP 'trusted-signing-metadata.json'
            @{
              Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT
              CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_PROFILE
            } | ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
            "OPENWHISPER_CPP_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
            "OPENWHISPER_CPP_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
            Write-Host "::notice title=Windows signing::Signing with Azure Trusted Signing."
          } else {
            Write-Host "::notice title=Windows signing::No Windows signing secrets are set; the executables and installer will be unsigned."
          }
      - name: Build the previous setup for the upgrade smoke test
        # No earlier OpenWhisper_CPP release is published, so the upgrade starts from this commit
        # built as version 0.0.0; build-installer.ps1 moves it to out\installer-previous when
        # the candidate is built.
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
        run: .\packaging\windows\build-installer.ps1 -Clean -Version 0.0.0
      - name: Build and verify the candidate
        # Signs, timestamps and verifies when the step above configured a method; otherwise
        # builds unsigned and verifies nothing is signed. Either way it writes
        # out/installer/windows-signing.json, BUILD-METADATA.json and SHA256SUMS.txt.
        shell: pwsh
        env:
          # Read by the Trusted Signing dlib (Azure EnvironmentCredential).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .\packaging\windows\build-installer.ps1 -Version $env:VERSION -RequireQtLicenses -SourceQualification passed
      - name: Remove signing certificate
        if: always() && env.OPENWHISPER_CPP_SIGN_CERT_SHA1 != ''
        shell: pwsh
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:OPENWHISPER_CPP_SIGN_CERT_SHA1" -DeleteKey -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-health-windows
          path: out/release-health.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upgrade the previous setup and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          .\packaging\windows\smoke-setup.ps1
          -PreviousSetup out\installer-previous\OpenWhisper_CPP-Setup-0.0.0.exe
          -NewSetup "out\installer\OpenWhisper_CPP-Setup-$env:VERSION.exe"
          -Version $env:VERSION
      - name: Preserve Windows lifecycle logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-setup-logs
          path: ${{ runner.temp }}/openwhisper-cpp-setup-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Qualify the candidate
        # The candidate must name this commit and this run, carry passed source qualification,
        # and match its checksums exactly, before it is kept.
        shell: pwsh
        env:
          COMMIT: ${{ needs.source.outputs.commit }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -I -B tools\release\check_release_qualification.py --dir out\installer `
            --require-source-qualification --expected-commit $env:COMMIT --expected-run $env:RUN_ID
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwhisper-cpp-release-candidate
          path: out/installer/
          if-no-files-found: error
          retention-days: 14
